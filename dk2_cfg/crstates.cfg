; KeeperFX Creature States Configuration file
;
; --- Custom states for the Casino room (driven from map00013.lua) ---
;
; The engine's CreatureStates enum has exactly nine unused placeholder slots that
; no engine code ever assigns, so they are safe to repurpose:
;   15, 27, 29, 55, 56, 57, 58, 62, 63
; We use 55 and 56.
;
; Do NOT define [state0]. Index 0 is CrSt_Unused and is used engine-wide as the
; "no state set" sentinel (continue_state = CrSt_Unused, get_job_for_creature_state
; returning Job_NULL, job configs defaulting to it). Repurposing it corrupts that.
;
; The Lua function names below are resolved at CFG PARSE TIME via lua_getglobal.
; They must already exist as globals when this file is read, so they are defined
; at the top level of map00013.lua, never inside OnGameStart().

[state55]
Name = CasinoWalking
ProcessFunction = Casino_Walk_Process
CleanupFunction = Casino_Walk_Cleanup
MoveFromSlabFunction = none
MoveCheckFunction = none
Overrides = OWN_NEEDS GETS_SALARY
StateType = OwnNeeds
Captive = 0
Transition = 0
FollowBehavior = none
BlocksAllStateChanges = 0
SpriteIdx = 0
DisplayThoughtBubble = 1
Sneaky = 0
ReactToCta = 1

[state56]
Name = CasinoGambling
ProcessFunction = Casino_Play_Process
CleanupFunction = Casino_Play_Cleanup
MoveFromSlabFunction = none
MoveCheckFunction = none
Overrides = OWN_NEEDS GETS_SALARY
StateType = OwnNeeds
Captive = 0
Transition = 0
FollowBehavior = none
BlocksAllStateChanges = 0
SpriteIdx = 0
DisplayThoughtBubble = 1
Sneaky = 0
ReactToCta = 1
